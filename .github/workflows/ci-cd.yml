name: Pipeline CI/CD - Conecta

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # ==========================================
  # JOB 1: CONTINUOUS INTEGRATION (CI)
  # ==========================================
  ci:
    name: Build, Banco, Lint e Testes
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: conecta
          POSTGRES_PASSWORD: conecta_dev
          POSTGRES_DB: conecta
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://conecta:conecta_dev@localhost:5433/conecta
      AUTH_SECRET: ci-dummy-secret-for-build-and-tests
      APP_URL: http://localhost:3000
      GOOGLE_CLIENT_ID: ci-dummy-client-id
      GOOGLE_CLIENT_SECRET: ci-dummy-client-secret

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Inicializar Banco de Dados (Schema e Migrations)
        run: |
          sudo apt-get update && sudo apt-get install -y postgresql-client
          PGPASSWORD=conecta_dev psql -h localhost -p 5433 -U conecta -d conecta -f db/init.sql
          for f in db/migrations/*.sql; do
            echo "Aplicando $f..."
            PGPASSWORD=conecta_dev psql -h localhost -p 5433 -U conecta -d conecta -f "$f"
          done

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instalar dependências
        run: npm ci

      - name: Rodar Linter
        run: npm run lint

      - name: Executar Testes Automatizados
        run: npm test --if-present

      - name: Validar Build de Produção
        run: npm run build

  # ==========================================
  # JOB 2: CONTINUOUS DEPLOYMENT (CD)
  # ==========================================
  cd:
    name: Build e Push da Imagem Docker
    runs-on: ubuntu-latest
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login no Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build e Push da Imagem Docker
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/conecta:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/conecta:${{ github.sha }}