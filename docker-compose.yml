services:
  postgres:
    image: postgres:17-alpine
    container_name: conecta-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: conecta
      POSTGRES_USER: conecta
      POSTGRES_PASSWORD: conecta_dev
    ports:
      - "5433:5432"
    volumes:
      - conecta-postgres-data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U conecta -d conecta"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  conecta-postgres-data: